[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ventral-dorsal-model"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "allensdk==2.16.2",
    "imageio",
    "joblib",
    "kornia>=0.8.2",
    "matplotlib",
    "numpy==1.23.5",
    "opencv-python==4.6.0.66",
    "pandas",
    "pillow",
    "scikit-learn",
    "scipy",
    "seaborn",
    "setuptools<81",
    "statsmodels<0.15",
    "tensorboardx",
    "threadpoolctl",
    "torch==2.7.*",
    "torchvision>=0.21.0",
    "tqdm",
    "hdmf<4",
]

# Tooling that no module imports
[dependency-groups]
dev = ["ruff>=0.8.4"]

[tool.setuptools.packages.find]
include = ["config*", "datagen*", "models*", "RSM*", "plotting*"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B", "C4", "RUF"]
ignore = ["B008", "RUF003"]
